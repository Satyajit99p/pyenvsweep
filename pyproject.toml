[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyenvsweep"
version = "0.1.0"
description = "List, audit and remove packages across all Python environments on this machine"
requires-python = ">=3.9"

[project.scripts]
pyenvsweep = "pyenvsweep.cli:main"

[tool.setuptools]
packages = ["pyenvsweep"]
